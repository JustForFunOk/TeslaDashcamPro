<!-- video-player.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeslaDashcamPro v1.0.3</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <!-- 主播放区域容器 -->
    <div class="main-video-wrapper">
        <!-- 主播放视频 -->
        <div class="main-video-container">
            <video id="main-video" class="main-video" muted src=""></video>

            <!-- 左上角 overlay: 返回按钮和时间 -->
            <div class="overlay-top-left">
                <button id="back-button" tabindex="-1" class="overlay-button">
                    <img id="back-icon" src="back_bold.svg" alt="back to home" class="invert-color-icon" />
                </button>
                <div id="timestamp" class="overlay-timestamp"></div>
            </div>

            <!-- 右上角 overlay: 驾驶信息 -->
            <div id="can-data" class="overlay-top-right">
                <div id="speed" class="overlay-speed"></div>
                <div id="gear" class="vehicle-info-icon overlay-vehicle-icon"></div>
                <div id="driving-mode" class="vehicle-info-icon overlay-vehicle-icon">
                    <img id="steering-wheel-icon" src="steering_wheel_min.svg" alt="steering wheel icon" class="icon" />
                    <div id="driving-mode-text" class="icon-bottom-text"></div>
                </div>
                <div id="brake-pedal" class="vehicle-info-icon overlay-vehicle-icon">
                    <img id="brake-pedal-icon" src="brake_pedal_min.svg" alt="brake pedal status" class="icon" />
                </div>
                <div id="accelerator-pedal" class="vehicle-info-icon overlay-vehicle-icon">
                    <img id="accelerator-pedal-icon" src="accelerator_pedal_min.svg" alt="accelerator pedal status"
                        class="icon" />
                    <div id="accel-percentage-text" class="icon-bottom-text"></div>
                </div>
                <div id="left-turn-light" class="vehicle-info-icon overlay-vehicle-icon">
                    <img id="left-arrow-icon" src="left_arrow.svg" alt="turn left light status" class="icon" />
                </div>
                <div id="right-turn-light" class="vehicle-info-icon overlay-vehicle-icon">
                    <img id="right-arrow-icon" src="right_arrow.svg" alt="turn right light status" class="icon" />
                </div>
            </div>

            <!-- 底部 overlay: 播放控制 -->
            <div class="overlay-bottom-controls">
                <div class="controls-overlay">
                    <button id="backward-btn" tabindex="-1" class="tool-bar-button overlay-control-button">
                        <img id="backward-icon" src="backward_5_seconds_simple.svg" alt="backward 5 seconds"
                            class="invert-color-icon" />
                    </button>
                    <button id="play-pause-btn" tabindex="-1" class="tool-bar-button overlay-control-button">
                        <img id="play-pause-icon" src="play.svg" alt="play/pause icon" class="invert-color-icon" />
                    </button>
                    <button id="x-speed-btn" tabindex="-1" class="tool-bar-button overlay-control-button">
                        <img id="x-speed-icon" src="x_speed.svg" alt="forward speed" class="invert-color-icon" />
                        <div id="x-speed-text" class="button-text">1x</div>
                    </button>
                    <div id="current-time" class="bar-time overlay-time">mm:ss</div>
                    <div class="slider-container-overlay">
                        <input type="range" id="progress-bar" tabindex="-1" value="0">
                        <div id="event-marker" class="marker hidden"></div>
                    </div>
                    <div id="total-duration" class="bar-time overlay-time">mm:ss</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部多视角缩略图列表 -->
    <div class="multi-view-container">
        <div class="multi-view-list">
            <!-- 前视 -->
            <div class="thumbnail-item" data-view="F">
                <video class="thumbnail-video" muted></video>
                <div class="thumbnail-label">Front</div>
            </div>
            <!-- 后视 -->
            <div class="thumbnail-item" data-view="B">
                <video class="thumbnail-video" muted></video>
                <div class="thumbnail-label">Rear</div>
            </div>
            <!-- 左视 -->
            <div class="thumbnail-item" data-view="L">
                <video class="thumbnail-video" muted></video>
                <div class="thumbnail-label">Left</div>
            </div>
            <!-- 右视 -->
            <div class="thumbnail-item" data-view="R">
                <video class="thumbnail-video" muted></video>
                <div class="thumbnail-label">Right</div>
            </div>
            <!-- 左前视 -->
            <div class="thumbnail-item" data-view="LF">
                <video class="thumbnail-video" muted></video>
                <div class="thumbnail-label">LeftFront</div>
            </div>
            <!-- 右前视 -->
            <div class="thumbnail-item" data-view="RF">
                <video class="thumbnail-video" muted></video>
                <div class="thumbnail-label">RightFront</div>
            </div>
        </div>
    </div>



    <script src="./script.js"></script>
</body>

</html>
